  <circle cx="600" cy="220" r="110" stroke="#FF8F00" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Glowing Clay Diya -->
  <path d="M600 105C600 105 632 145 632 172C632 192 617.6 206 600 206C582.4 206 568 192 568 172C568 145 600 105 600 105Z" fill="url(#flame)"/>
  <path d="M600 128C600 128 618 152 618 172C618 184 610 194 600 194C590 194 582 184 582 172C582 152 600 128 600 128Z" fill="#FFFDF8"/>
  <path d="M515 212C525 256 558 278 600 278C642 278 675 256 685 212C658 224 629 228 600 228C571 228 542 224 515 212Z" fill="url(#bowl)" stroke="#FFD700" stroke-width="3"/>

  <!-- Typography -->
