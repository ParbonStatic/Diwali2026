<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="280" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" stroke="url(#gold)" stroke-width="3"/>
  <rect x="42" y="42" width="1116" height="546" rx="14" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5"/>

