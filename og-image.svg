  <text x="600" y="420" text-anchor="middle" fill="#FFFDF8" font-family="Georgia, serif" font-weight="bold" font-size="58">Illuminating Hearts &amp; Homes</text>
  <text x="600" y="478" text-anchor="middle" fill="#E2D4BA" font-family="sans-serif" font-size="24">Celebrating the 5 Sacred Days of Diwali • Light Over Darkness</text>
  <text x="600" y="545" text-anchor="middle" fill="#D4AF37" font-family="Georgia, serif" font-size="20">ॐ असतो मा सद्गमय । तमसो मा ज्योतिर्गमय ॥</text>

  <defs>
